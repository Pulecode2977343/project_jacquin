<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Admin Programas - JACQUIN</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" />
  <link rel="stylesheet" href="css/style.css?v=27" />
  <style>
    /* Specific styles for this dashboard */
    .admin-container {
      padding: 2rem 5%;
      padding-top: 150px;
      margin-top: 0;
      min-height: 100vh;
    }

    .admin-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
      flex-wrap: wrap;
      gap: 20px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
    }

    .full-width {
      grid-column: span 2;
    }

    .form-group {
      margin-bottom: 1rem;
    }

    .form-group label {
      display: block;
      color: var(--color-acento-azul);
      margin-bottom: 0.5rem;
      font-size: 0.9rem;
    }

    .form-control {
      width: 100%;
      padding: 10px;
      background: rgba(0, 0, 0, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      color: white;
      font-family: inherit;
    }

    .form-control:focus {
      outline: none;
      border-color: var(--color-acento-naranja);
    }

    /* Preview Area */
    .preview-container {
      margin-top: 1rem;
      max-width: 100%;
      border-radius: 10px;
      overflow: hidden;
      border: 1px dashed rgba(255, 255, 255, 0.2);
      min-height: 100px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(255, 255, 255, 0.3);
    }

    .preview-media {
      max-width: 100%;
      max-height: 200px;
      object-fit: cover;
    }

    .programs-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.5rem;
      margin-bottom: 50px;
    }

    .admin-program-card {
      background: rgba(255, 255, 255, 0.03);
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.1);
      transition: transform 0.3s ease;
    }

    .admin-program-card:hover {
      transform: translateY(-5px);
      background: rgba(255, 255, 255, 0.05);
    }

    .program-thumb {
      height: 150px;
      width: 100%;
      object-fit: cover !important;
      display: block;
      background: #1a2634;
    }

    .program-info {
      padding: 1.2rem;
    }

    .btn-edit {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      background: rgba(255, 255, 255, 0.1);
      border: none;
      color: white;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-edit:hover {
      background: var(--color-acento-azul);
      color: #1a2634;
      font-weight: bold;
    }

    /* Modal Styles */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(8px);
      z-index: 1100;
      display: none;
      justify-content: center;
      align-items: center;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .modal-content {
      background: #1a2634;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 2rem;
      width: 95%;
      max-width: 700px;
      max-height: 90vh;
      overflow-y: auto;
      position: relative;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5);
    }

    @media (max-width: 768px) {
      .admin-container {
        padding-top: 120px;
        padding-left: 15px;
        padding-right: 15px;
      }

      .admin-header {
        flex-direction: column;
        align-items: flex-start;
      }

      .admin-header div:last-child {
        width: 100%;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .admin-header button {
        width: 100%;
        justify-content: center;
      }
    }
  </style>
</head>

<body>
  <jam-header></jam-header>

  <main class="admin-container">
    <div class="admin-header">
      <div>
        <h1 style="color: white; margin-top: 0.5rem">Gestión de Programas</h1>
        <p style="color: var(--color-humo-gris)">
          Edita la información de las tarjetas de programas de la página principal.
        </p>
      </div>
      <div style="display:flex; gap:10px;">
        <button onclick="window.openCreateModal()" class="btn"
          style="padding: 12px 20px; background: var(--color-acento-azul); color: #1a2634; font-weight: bold; border-radius: 50px; border:none; box-shadow: 0 4px 15px rgba(52, 152, 219, 0.3); cursor: pointer;">
          <i class="bi bi-plus-circle" style="margin-right:8px;"></i> Nuevo Programa
        </button>
        <button onclick="window.resetData()" class="btn"
          style="padding: 12px 20px; background: rgba(255,59,48,0.1); color: #ff3b30; border:1px solid #ff3b30; border-radius: 50px; font-weight: bold; cursor: pointer;">
          <i class="bi bi-arrow-counterclockwise" style="margin-right:8px;"></i> Restaurar
        </button>
      </div>
    </div>

    <section>
      <div id="adminProgramsList" class="programs-list">
        <div style="text-align: center; color: gray; grid-column: span 3; padding: 40px;">Cargando programas...</div>
      </div>
    </section>

    <!-- Edit/Create Modal -->
    <div id="programModal" class="modal-overlay">
      <div class="modal-content">
        <button onclick="closeModal()"
          style="position: absolute; top: 15px; right: 15px; background: transparent; border: none; color: white; font-size: 1.5rem; cursor: pointer;">
          <i class="bi bi-x-lg"></i>
        </button>

        <h3 id="modalTitle" style="color: white; margin-bottom: 2rem; text-align: center;">Editar Programa</h3>

        <form id="programForm">
          <input type="hidden" id="program_id" name="id" />

          <div class="form-grid">
            <div class="form-group">
              <label>Título</label>
              <input type="text" class="form-control" name="title" required />
            </div>

            <div class="form-group">
              <label>Subtítulo</label>
              <input type="text" class="form-control" name="subtitle" required />
            </div>

            <div class="form-group full-width">
              <label>Descripción</label>
              <textarea class="form-control" name="description" rows="4" required></textarea>
            </div>

            <div class="form-group">
              <label>Icono (Bootstrap Icons)</label>
              <input type="text" class="form-control" name="icon" placeholder="Ej: bi-music-note" />
              <a href="https://icons.getbootstrap.com/" target="_blank"
                style="font-size: 0.8rem; color: var(--color-acento-azul);">Ver catálogo de iconos</a>
            </div>

            <div class="form-group">
              <label>Características (Separar por comas)</label>
              <textarea class="form-control" name="features" rows="2"
                placeholder="Ej: Técnica, Lectura, Ritmo"></textarea>
            </div>

            <div class="form-group full-width">
              <label>Imagen de Fondo</label>
              <input type="file" class="form-control" id="imageInput" accept="image/*" onchange="previewImage(this)" />
              <input type="hidden" name="image" id="imageBase64" />
              <div class="preview-container" id="preview-img">
                <p>Previsualización</p>
              </div>
            </div>

            <div class="full-width" style="margin-top: 2rem; display: flex; gap: 15px;">
              <button type="button" class="btn"
                style="flex: 1; background: rgba(255,255,255,0.1); border:1px solid #555; color:white; padding: 12px; border-radius: 10px; cursor: pointer;"
                onclick="closeModal()">
                Cancelar
              </button>
              <button type="submit" class="btn"
                style="flex: 2; background: var(--color-acento-azul); color: #1a2634; font-weight: bold; padding: 12px; border-radius: 10px; border:none; box-shadow: 0 0 15px rgba(52, 152, 219, 0.4); cursor: pointer;">
                <i class="bi bi-save" style="margin-right:8px;"></i> Guardar Cambios
              </button>
            </div>
          </div>
        </form>
      </div>
    </div>
  </main>

  <jam-footer></jam-footer>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="js/services/api.js?v=4.4"></script>
  <script src="js/helpers/AvatarHelper.js?v=1.3"></script>
  <script src="js/components/Navbar.js?v=2.6"></script>
  <script src="js/components/Header.js?v=4.3"></script>
  <script src="js/components/Footer.js?v=2.4"></script>
  <script src="js/toast_overlay.js?v=2.5"></script>
  <script src="js/admin_programs.js?v=1.1"></script>
</body>

</html>
