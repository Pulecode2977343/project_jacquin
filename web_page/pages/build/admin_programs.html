<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Admin Programas - JACQUIN</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" />
  <link rel="stylesheet" href="css/footer.css" />
  <link rel="stylesheet" href="css/style.css?v=25" />

  <style>
    /* Specific styles for this dashboard */
    .admin-container {
      padding: 17vh 5% 2rem;
      margin-top: 0;
      transition: padding-right 0.3s ease;
    }



    .admin-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 40px;
      padding-bottom: 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      flex-wrap: wrap;
      gap: 20px;
    }

    .admin-header h1 {
      font-size: 2rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 15px;
      margin: 0;
      color: white;
    }

    .admin-header h1 i {
      color: #e67e22;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
    }

    .full-width {
      grid-column: span 2;
    }

    .form-group {
      margin-bottom: 1rem;
    }

    .form-group label {
      display: block;
      color: var(--color-acento-azul);
      margin-bottom: 0.5rem;
      font-size: 0.9rem;
    }

    .form-control {
      width: 100%;
      padding: 10px;
      background: rgba(0, 0, 0, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      color: white;
      font-family: inherit;
    }

    .form-control:focus {
      outline: none;
      border-color: var(--color-acento-naranja);
    }

    /* Preview Area */
    .preview-container {
      margin-top: 1rem;
      max-width: 100%;
      border-radius: 10px;
      overflow: hidden;
      border: 1px dashed rgba(255, 255, 255, 0.2);
      min-height: 100px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(255, 255, 255, 0.3);
    }

    .preview-media {
      max-width: 100%;
      max-height: 200px;
      object-fit: cover;
    }

    .programs-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 25px;
    }

    .admin-program-card {
      background: rgba(255, 255, 255, 0.03);
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.1);
      transition: transform 0.3s ease;
    }

    .admin-program-card:hover {
      transform: translateY(-5px);
      background: rgba(255, 255, 255, 0.05);
    }

    .program-thumb {
      height: 150px;
      /* Fixed height for consistency */
      width: 100%;
      object-fit: cover !important;
      display: block;
      border: none;
      margin: 0;
      padding: 0;
      background: #1a2634;
      /* Fallback color matching card */
    }

    .program-info {
      padding: 1.2rem;
    }

    .btn-edit {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      background: rgba(255, 255, 255, 0.1);
      border: none;
      color: white;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-edit:hover {
      background: var(--color-acento-azul);
    }

    /* Modal Styles */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(8px);
      z-index: 1000;
      display: none;
      /* Controlled by JS */
      justify-content: center;
      align-items: center;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .modal-content {
      background: #1a2634;
      /* Solid dark blue for contrast */
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 2rem;
      width: 95%;
      max-width: 700px;
      max-height: 90vh;
      overflow-y: auto;
      position: relative;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5);
    }

    @media (max-width: 768px) {
      .admin-container {
        padding-left: 20px;
        padding-right: 20px;
      }

      .admin-header {
        flex-direction: column;
        align-items: flex-start;
        gap: 20px;
      }

      .admin-header>div:last-child {
        width: 100%;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .admin-header button {
        width: 100%;
        justify-content: center;
      }
    }
  </style>
</head>

<body>
  <div id="react-header-root"></div>

  <main class="admin-container">
    <!-- Breadcrumb / Header -->
    <div class="admin-header">
      <div>
        <h1>
          <i class="bi bi-collection-play-fill"></i>
          Gestión de Programas
        </h1>
        <p style="color: var(--color-humo-gris); margin: 6px 0 0 0;">
          Edita la información de las tarjetas de programas.
        </p>
      </div>
      <div style="display:flex; gap:10px;">
        <!-- Removed btn-login class to avoid z-index masking issues on text nodes -->
        <button onclick="window.openCreateModal()" class="btn"
          style="padding: 12px 20px; background: var(--color-acento-azul); color: #1a2634; font-weight: bold; border-radius: 50px; border:none; box-shadow: 0 4px 15px rgba(52, 152, 219, 0.3);">
          <i class="bi bi-plus-circle" style="margin-right:8px;"></i> Nuevo Programa
        </button>
        <button onclick="window.resetData()" class="btn"
          style="padding: 12px 20px; background: rgba(255,59,48,0.1); color: #ff3b30; border:1px solid #ff3b30; border-radius: 50px; font-weight: bold;">
          <i class="bi bi-arrow-counterclockwise" style="margin-right:8px;"></i> Restaurar
        </button>
      </div>
    </div>

    <!-- Programs List -->
    <section>
      <div id="adminProgramsList" class="programs-list">
        <div style="text-align: center; color: gray; grid-column: span 3;">Cargando programas...</div>
      </div>
    </section>

    <!-- Edit Modal Overlay -->
    <div id="programModal" class="modal-overlay">
      <div class="modal-content"
        style="max-width: 1000px; padding: 0; overflow: hidden; display: flex; flex-direction: column; background: #0f172a;">
        <button onclick="closeModal()"
          style="position: absolute; top: 20px; right: 20px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: white; font-size: 1.2rem; cursor: pointer; z-index: 10; width: 40px; height: 40px; border-radius: 50%; display: flex; align-items:center; justify-content:center; transition: 0.2s;"
          onmouseover="this.style.background='rgba(231,76,60,0.2)'; this.style.color='#e74c3c';">
          <i class="bi bi-x-lg"></i>
        </button>

        <div class="modal-header-tabs"
          style="background: rgba(0,0,0,0.2); padding: 30px 30px 0 30px; border-bottom: 1px solid rgba(255,255,255,0.05); flex-shrink: 0;">
          <div style="display:flex; align-items:center; gap:15px; margin-bottom: 25px;">
            <div id="modalMainIcon"
              style="width: 50px; height: 50px; border-radius: 14px; background: rgba(147,182,238,0.1); display:flex; align-items:center; justify-content:center; color: var(--color-acento-azul); font-size: 1.8rem;">
              <i class="bi bi-gear-fill"></i>
            </div>
            <div>
              <h2 id="modalMainTitle"
                style="color: white; margin: 0; font-size: 1.6rem; font-weight: 700; letter-spacing: -0.5px;">
                Gestión de Programa
              </h2>
              <p id="modalMainSubtitle" style="color:rgba(255,255,255,0.4); margin:4px 0 0 0; font-size: 0.85rem;">
                Centro de control unificado: Web y Academia.</p>
            </div>
          </div>

          <div class="tabs-nav" style="display: flex; gap: 30px;">
            <button class="tab-btn active" onclick="switchProgramTab('tab-web')" id="btn-tab-web"
              style="background:none; border:none; color:var(--color-acento-azul); padding-bottom:15px; border-bottom:3px solid var(--color-acento-azul); cursor:pointer; font-weight:700; font-size:0.9rem; transition:0.2s; text-transform: uppercase; letter-spacing:1px; display:flex; align-items:center; gap:8px;">
              <i class="bi bi-globe"></i> Contenido Web
            </button>
            <button class="tab-btn" onclick="switchProgramTab('tab-schedules')" id="btn-tab-schedules"
              style="background:none; border:none; color:rgba(255,255,255,0.4); padding-bottom:15px; border-bottom:3px solid transparent; cursor:pointer; font-weight:700; font-size:0.9rem; transition:0.2s; text-transform: uppercase; letter-spacing:1px; display:flex; align-items:center; gap:8px;">
              <i class="bi bi-calendar3"></i> Horarios y Facultad
            </button>
            <button class="tab-btn" onclick="switchProgramTab('tab-students')" id="btn-tab-students"
              style="background:none; border:none; color:rgba(255,255,255,0.4); padding-bottom:15px; border-bottom:3px solid transparent; cursor:pointer; font-weight:700; font-size:0.9rem; transition:0.2s; text-transform: uppercase; letter-spacing:1px; display:flex; align-items:center; gap:8px;">
              <i class="bi bi-people"></i> Estudiantes
            </button>
          </div>
        </div>

        <div class="modal-body custom-scroll"
          style="padding: 30px; overflow-y: auto; flex: 1; background: linear-gradient(to bottom, #0f172a, #111827);">

          <!-- Tab 1: Web Content -->
          <div id="tab-web" class="program-tab-content">
            <form id="programForm">
              <input type="hidden" id="program_id" name="id" />
              <div class="form-grid">
                <div class="form-group">
                  <label
                    style="color:rgba(147,182,238,0.7); font-weight:600; font-size:0.8rem; text-transform:uppercase; margin-bottom:8px; display:block;">Título
                    del Programa</label>
                  <input type="text" class="form-control" name="title" required placeholder="Ej: Piano Clásico"
                    style="background:rgba(0,0,0,0.3); border:1px solid rgba(255,255,255,0.1); color:white; border-radius:10px; padding:12px; transition:0.3s;"
                    onfocus="this.style.borderColor='var(--color-acento-azul)'" />
                </div>

                <div class="form-group">
                  <label
                    style="color:rgba(147,182,238,0.7); font-weight:600; font-size:0.8rem; text-transform:uppercase; margin-bottom:8px; display:block;">Subtítulo
                    / Área</label>
                  <input type="text" class="form-control" name="subtitle" required
                    placeholder="Ej: Instrumento de Cuerdas"
                    style="background:rgba(0,0,0,0.3); border:1px solid rgba(255,255,255,0.1); color:white; border-radius:10px; padding:12px;" />
                </div>

                <div class="form-group full-width">
                  <label
                    style="color:rgba(147,182,238,0.7); font-weight:600; font-size:0.8rem; text-transform:uppercase; margin-bottom:8px; display:block;">Descripción
                    Comercial (Pestaña Programas)</label>
                  <textarea class="form-control" name="description" rows="4" required
                    placeholder="Atrae a tus futuros alumnos con una descripción impactante..."
                    style="background:rgba(0,0,0,0.3); border:1px solid rgba(255,255,255,0.1); color:white; border-radius:10px; padding:12px; resize:none;"></textarea>
                </div>

                <div class="form-group">
                  <label
                    style="color:rgba(147,182,238,0.7); font-weight:600; font-size:0.8rem; text-transform:uppercase; margin-bottom:8px; display:block;">Icono
                    Identificador</label>
                  <div style="display:flex; gap:12px; align-items:center;">
                    <input type="text" class="form-control" name="icon" placeholder="Ej: bi-music-note"
                      style="background:rgba(0,0,0,0.3); border:1px solid rgba(255,255,255,0.1); color:white; border-radius:10px; padding:12px; flex:1;" />
                    <div id="iconPreview"
                      style="width:48px; height:48px; border-radius:10px; background:rgba(255,255,255,0.05); display:flex; align-items:center; justify-content:center; color:var(--color-acento-azul); font-size:1.4rem;">
                      <i class="bi bi-music-note"></i>
                    </div>
                  </div>
                  <a href="https://icons.getbootstrap.com/" target="_blank"
                    style="font-size: 0.75rem; color: var(--color-acento-azul); margin-top:8px; display:inline-block; opacity:0.8;">Ver
                    catálogo oficial de iconos</a>
                </div>

                <div class="form-group">
                  <label
                    style="color:rgba(147,182,238,0.7); font-weight:600; font-size:0.8rem; text-transform:uppercase; margin-bottom:8px; display:block;">Puntos
                    Clave (Separar por comas)</label>
                  <textarea class="form-control" name="features" rows="2"
                    placeholder="Ej: Clases Personalizadas, Teoría Aplicada, Certificado"
                    style="background:rgba(0,0,0,0.3); border:1px solid rgba(255,255,255,0.1); color:white; border-radius:10px; padding:12px; resize:none;"></textarea>
                </div>

                <div class="form-group full-width">
                  <label
                    style="color:rgba(147,182,238,0.7); font-weight:600; font-size:0.8rem; text-transform:uppercase; margin-bottom:8px; display:block;">Imagen
                    Publicitaria</label>
                  <div
                    style="background: rgba(0,0,0,0.2); border: 2px dashed rgba(255,255,255,0.08); border-radius:16px; padding: 25px; text-align: center; position:relative;">
                    <input type="file" class="form-control" id="imageInput" accept="image/*"
                      onchange="previewImage(this)"
                      style="margin-bottom:15px; background:rgba(255,255,255,0.03); border:none;" />
                    <input type="hidden" name="image" id="imageBase64" />
                    <div id="imagePreviewContainer"
                      style="max-height: 250px; overflow: hidden; border-radius: 12px; display:none; border:1px solid rgba(255,255,255,0.1);">
                      <img id="imagePreview" src="" style="width: 100%; height: auto; object-fit:cover;" />
                    </div>
                    <div id="imagePlaceholder" style="padding:40px 0; color:rgba(255,255,255,0.2);">
                      <i class="bi bi-image"
                        style="font-size:3rem; display:block; margin-bottom:10px; opacity:0.5;"></i>
                      <p style="margin:0; font-size:0.9rem;">Haz clic para cambiar la imagen actual</p>
                    </div>
                  </div>
                </div>
              </div>

              <div
                style="margin-top: 40px; display: flex; gap: 15px; justify-content: flex-end; padding-top:25px; border-top:1px solid rgba(255,255,255,0.05);">
                <button type="button" onclick="closeModal()" class="btn"
                  style="background: rgba(255,255,255,0.05); color: white; border: 1px solid rgba(255,255,255,0.1); padding: 12px 25px; border-radius: 12px; font-weight:600;">
                  Descartar
                </button>
                <button type="submit" class="btn"
                  style="background: var(--color-acento-azul); color: #0f172a; font-weight: 700; padding: 12px 35px; border-radius: 12px; box-shadow: 0 10px 20px rgba(52, 152, 219, 0.2); transition:0.3s;"
                  onmouseover="this.style.transform='translateY(-2px)'"
                  onmouseout="this.style.transform='translateY(0)'">
                  <i class="bi bi-save-fill" style="margin-right:8px;"></i> Guardar Publicidad
                </button>
              </div>
            </form>
          </div>

          <!-- Tab 2: Schedules & Teachers -->
          <div id="tab-schedules" class="program-tab-content" style="display:none;">
            <div id="academicSchedulesContent">
              <!-- Se inyectará desde JS -->
              <div style="text-align:center; padding:100px; color:rgba(255,255,255,0.3);">
                <i class="bi bi-hourglass-split"
                  style="font-size:3rem; display:block; margin-bottom:15px; animation: pulse 1.5s infinite;"></i>
                Sincronizando datos académicos...
              </div>
            </div>
          </div>

          <!-- Tab 3: Students -->
          <div id="tab-students" class="program-tab-content" style="display:none;">
            <div id="academicStudentsContent">
              <!-- Se inyectará desde JS -->
            </div>
          </div>

        </div>
      </div>
    </div>
  </main>

  <div id="react-footer-root"></div>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="js/services/api.js"></script>
  <script src="js/react-footer.bundle.js"></script>
  <script src="js/toast_overlay.js"></script>

  <!-- Admin Logic -->
  <script src="js/admin_academic_schedules.js"></script>
  <script src="js/admin_programs.js"></script>
  <script src="js/messaging_widget.js"></script>
  <script src="js/react-header.bundle.js?v=1.5"></script>
</body>

</html>
