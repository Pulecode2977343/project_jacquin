<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JACQUIN - Estudiantes</title>
    <link rel="stylesheet" href="css/style.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
    />
    <style>
      .module-section {
        padding: 2rem 5%;
        min-height: 80vh;
        color: white;
        text-align: center;
      }
      .placeholder-content {
        background: rgba(255, 255, 255, 0.05);
        padding: 3rem;
        border-radius: 20px;
        margin-top: 2rem;
        backdrop-filter: blur(10px);
      }
    </style>
  </head>
  <body>
    <jam-header></jam-header>

    <main>
      <section class="module-section">
        <div
          style="
            display: flex;
            justify-content: space-between;
            align-items: center;
          "
        >
          <h1>Panel Estudiantil</h1>
          <a href="gestion.html" class="btn-module" style="width: auto"
            >Volver</a
          >
        </div>

        <div class="placeholder-content">
          <i
            class="bi bi-mortarboard"
            style="font-size: 4rem; color: var(--color-acento-azul)"
          ></i>
          <h2 style="margin: 20px 0">Módulo de Calificaciones y Pagos</h2>
          <p style="color: var(--color-humo-gris)">
            Próximamente podrás visualizar tus notas, progreso académico y
            estado de cuenta aquí.
            <br />Esta funcionalidad está en desarrollo connectada al sistema
            administrativo.
          </p>
        </div>
      </section>
    </main>

    <jam-footer></jam-footer>

    <script src="js/components/Navbar.js"></script>
    <script src="js/components/Header.js"></script>
    <script src="js/components/Footer.js"></script>
    <script src="js/services/api.js"></script>
    <script>
      // Security Check
      document.addEventListener("DOMContentLoaded", () => {
        if (!ApiService.isAuthenticated()) window.location.href = "login.html";
      });
    </script>
  </body>
</html>
