<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>J.A.M Inicia Sesión</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <jam-header></jam-header>

    <main class="main-submit">
      <section class="form-card">
        <form name="login" id="login-form">
          <h1>Ingresar</h1>

          <div class="form-group">
            <label for="email">Correo Electrónico</label>
            <div class="input-wrapper">
              <i class="bi bi-envelope form-icon"></i>
              <input
                class="form-input-neumorph with-icon"
                type="email"
                name="email"
                id="email"
                placeholder="usuario@ejemplo.com"
              />
            </div>
          </div>

          <div class="form-group">
            <label for="password">Contraseña</label>
            <div class="input-wrapper">
              <i class="bi bi-lock form-icon"></i>
              <input
                class="form-input-neumorph with-icon"
                type="password"
                name="password"
                id="password"
                placeholder="••••••••"
              />
              <i
                class="bi bi-eye-slash toggle-password"
                id="togglePassword"
              ></i>
            </div>
          </div>

          <div style="text-align: center; margin-top: 2rem">
            <button class="btn btn-login-submit" type="submit">
              Iniciar Sesión
              <i class="bi bi-send-fill icon-send"></i>
            </button>

            <p
              style="
                font-size: 0.75rem;
                color: var(--color-humo-gris);
                margin-top: 15px;
                opacity: 0.8;
              "
            >
              Al iniciar sesión, aceptas nuestros
              <a
                href="terms.html"
                style="
                  color: var(--color-humo-gris);
                  text-decoration: underline;
                "
                >Términos</a
              >
              y la
              <a
                href="dataPolicy.html"
                style="
                  color: var(--color-humo-gris);
                  text-decoration: underline;
                "
                >Política de Datos</a
              >.
            </p>
          </div>

          <p
            id="mensaje-respuesta"
            style="
              text-align: center;
              color: var(--naranja-neon);
              margin-top: 1rem;
              min-height: 20px;
            "
          ></p>

          <div
            class="option-login"
            style="
              text-align: center;
              margin-top: 2rem;
              color: var(--color-humo-gris);
              font-size: 0.9rem;
            "
          >
            <p>
              ¿Eres nuevo? <br />
              <a
                href="registro.html"
                style="color: var(--color-acento-azul); font-weight: bold"
                >¡Regístrate ahora!</a
              >
              <br /><br />
              ¿Olvidaste tu clave? <br />
              <a href="reset.html" style="color: var(--color-acento-naranja)"
                >Restablécela aquí.</a
              >
            </p>
          </div>
        </form>
      </section>
    </main>

    <jam-footer></jam-footer>

    <script src="js/components/Navbar.js"></script>
    <script src="js/components/Header.js"></script>
    <script src="js/components/Footer.js"></script>
    <script src="js/logoSound.js"></script>
    <script src="js/services/api.js"></script>
    <script src="js/login.js"></script>
  </body>
</html>
