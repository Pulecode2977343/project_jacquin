<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/style.css" />
    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
    />
    <title>JACQUIN - Inscripción</title>
  </head>
  <body>
    <jam-header></jam-header>

    <main class="main-submit">
      <section class="form-card">
        <h1>Inscripción Aspirante</h1>

        <form
          name="NewUser"
          action="DataReceiver"
          method="get"
          class="submit-form"
        >
          <div class="form-group">
            <label for="full-name">Nombre Completo</label>
            <input
              type="text"
              id="full-name"
              name="full-name"
              class="form-input-neumorph"
              placeholder="Escribe tu nombre y apellido"
              required
            />
          </div>

          <div class="form-group">
            <label for="email">Correo Electrónico</label>
            <input
              type="email"
              id="email"
              name="email"
              class="form-input-neumorph"
              placeholder="ejemplo@correo.com"
              required
            />
          </div>

          <div class="form-group">
            <label for="phone">Número de Teléfono</label>
            <input
              type="tel"
              id="phone"
              name="phone"
              class="form-input-neumorph"
              placeholder="+57 318 888 8888"
            />
          </div>

          <div class="form-group">
            <label for="age">Edad</label>
            <input
              type="number"
              id="age"
              name="age"
              min="5"
              max="99"
              class="form-input-neumorph"
              placeholder="Tu edad"
            />
          </div>

          <div class="form-group">
            <label for="address">Dirección de Residencia</label>
            <input
              type="text"
              id="address"
              name="address"
              class="form-input-neumorph"
              placeholder="Ej. Calle 29 #5A-33"
            />
          </div>

          <div class="form-group">
            <label for="course">Curso de Interés</label>

            <select id="course" name="course" class="form-input-neumorph">
              <option value="">Selecciona un curso</option>
              <option value="guitarra">Guitarra</option>
              <option value="piano">Piano</option>
              <option value="canto">Técnica Vocal</option>
              <option value="bateria">Batería</option>
              <option value="composicion">Composición Musical</option>
              <option value="teoria">Teoría Musical</option>
            </select>
          </div>

          <div
            style="
              font-size: 0.85rem;
              color: var(--color-humo-gris);
              margin-top: 1.5rem;
              text-align: left;
              padding: 0 10px;
            "
          >
            <label
              style="
                display: flex;
                gap: 10px;
                align-items: flex-start;
                margin-bottom: 8px;
              "
            >
              <input type="checkbox" required style="margin-top: 3px" />
              <span
                >He leído y acepto los
                <a href="terms.html" style="color: var(--color-acento-azul)"
                  >Términos y Condiciones</a
                >.</span
              >
            </label>
            <label style="display: flex; gap: 10px; align-items: flex-start">
              <input type="checkbox" required style="margin-top: 3px" />
              <span
                >Acepto la
                <a
                  href="dataPolicy.html"
                  style="color: var(--color-acento-azul)"
                  >Política de Tratamiento de Datos</a
                >.</span
              >
            </label>
          </div>

          <div style="text-align: center; margin-top: 2rem">
            <button type="submit" class="btn">ENVIAR REGISTRO</button>
          </div>
        </form>
      </section>
    </main>

    <jam-footer></jam-footer>

    <!-- Web Components & Logic -->
    <script src="js/components/Navbar.js"></script>
    <script src="js/components/Header.js"></script>
    <script src="js/components/Footer.js"></script>
  </body>
</html>
