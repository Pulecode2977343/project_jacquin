<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/style.css" />
    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
    />
    <title>JACQUIN - Inscripción</title>
  </head>
  <body>
    <jam-header></jam-header>

    <main class="main-submit">
      <section class="form-card">
        <h1>Inscripción Aspirante</h1>

        <form id="register-form" class="submit-form">
          <div class="form-group">
            <label for="full-name">Nombre Completo</label>
            <div class="input-wrapper">
              <i class="bi bi-person form-icon"></i>
              <input
                type="text"
                id="full-name"
                name="full-name"
                class="form-input-neumorph with-icon"
                placeholder="Escribe tu nombre y apellido"
                required
              />
            </div>
          </div>

          <div class="form-group">
            <label for="email">Correo Electrónico</label>
            <div class="input-wrapper">
              <i class="bi bi-envelope form-icon"></i>
              <input
                type="email"
                id="email"
                name="email"
                class="form-input-neumorph with-icon"
                placeholder="ejemplo@correo.com"
                required
              />
            </div>
          </div>

            <label for="phone">Número de Teléfono</label>
            <div class="input-wrapper">
              <i class="bi bi-telephone form-icon"></i>
              <input
                type="tel"
                id="phone"
                name="phone"
                class="form-input-neumorph with-icon"
                placeholder="+57 318 888 8888"
              />
            </div>
          </div>

          <!-- New Password Field -->
          <div class="form-group">
            <label for="password">Contraseña</label>
            <div class="input-wrapper">
              <i class="bi bi-lock form-icon"></i>
              <input
                type="password"
                id="password"
                name="password"
                class="form-input-neumorph with-icon"
                placeholder="Crea una contraseña segura"
                required
              />
            </div>
          </div>

          <div class="form-group">
            <label for="course">Curso de Interés</label>
            <div class="input-wrapper">
              <i class="bi bi-music-note-beamed form-icon"></i>
              <select
                id="course"
                name="course"
                class="form-input-neumorph with-icon"
              >
                <option value="">Selecciona un curso</option>
                <option value="percusión">Percusión</option>
                <option value="guitarra">Guitarra (Acústica y Eléctrica)</option>
                <option value="piano">Piano (Clásico y Moderno)</option>
                <option value="voz">Voz (Técnica Vocal)</option>
                <option value="seniors">Senior's (Adulto Mayor)</option>
                <option value="shows">Shows (Presentaciones en Vivo)</option>
                <option value="exploración">Exploración (Iniciación Musical)</option>
                <option value="psicomúsica">Psicomúsica (Bienestar y Terapia)</option>
              </select>
            </div>
          </div>

          <div
            style="
              font-size: 0.85rem;
              color: var(--color-humo-gris);
              margin-top: 1.5rem;
              text-align: left;
              padding: 0 10px;
            "
          >
            <label
              style="
                display: flex;
                gap: 10px;
                align-items: flex-start;
                margin-bottom: 8px;
              "
            >
              <input type="checkbox" required style="margin-top: 3px" />
              <span
                >He leído y acepto los
                <a href="terms.html" style="color: var(--color-acento-azul)"
                  >Términos y Condiciones</a
                >.</span
              >
            </label>
            <label style="display: flex; gap: 10px; align-items: flex-start">
              <input type="checkbox" required style="margin-top: 3px" />
              <span
                >Acepto la
                <a
                  href="dataPolicy.html"
                  style="color: var(--color-acento-azul)"
                  >Política de Tratamiento de Datos</a
                >.</span
              >
            </label>
          </div>

          <div style="text-align: center; margin-top: 2rem">
            <button type="submit" class="btn">ENVIAR REGISTRO</button>
          </div>
        </form>
      </section>
    </main>

    <jam-footer></jam-footer>

    <!-- Web Components & Logic -->
    <script src="js/components/Navbar.js"></script>
    <script src="js/components/Header.js"></script>
    <script src="js/components/Footer.js"></script>
    <script src="js/services/api.js"></script>
    <script src="js/register.js"></script>
  </body>
</html>
