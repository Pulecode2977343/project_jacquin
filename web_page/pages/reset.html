<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>J.A.M Recuperar Contraseña</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <jam-header></jam-header>

    <main class="main-submit">
      <section class="form-card" style="max-width: 500px">
        <form name="reset" action="userController" method="get">
          <h1>Recuperar Contraseña</h1>

          <p
            style="
              text-align: center;
              color: var(--color-humo-gris);
              margin-bottom: 2rem;
              font-size: 0.9rem;
            "
          >
            Ingresa tu correo electrónico registrado y te enviaremos las
            instrucciones para restablecer tu contraseña.
          </p>

          <div class="form-group">
            <label for="email">Correo Electrónico</label>
            <input
              type="email"
              name="email"
              id="email"
              class="form-input-neumorph"
              placeholder="usuario@ejemplo.com"
              required
            />
          </div>

          <div style="text-align: center; margin-top: 2rem">
            <input class="btn" type="submit" value="Enviar Instrucciones" />
          </div>

          <div style="text-align: center; margin-top: 1.5rem">
            <a
              href="login.html"
              style="color: var(--color-acento-azul); font-size: 0.9rem"
              >Volver al Inicio de Sesión</a
            >
          </div>
        </form>
      </section>
    </main>

    <jam-footer></jam-footer>

    <script src="js/components/Navbar.js"></script>
    <script src="js/components/Header.js"></script>
    <script src="js/components/Footer.js"></script>
    <script src="js/logoSound.js"></script>
  </body>
</html>
