<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>J.A.M Recuperar Contraseña</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <jam-header></jam-header>

    <main class="main-submit">
      <section class="form-card" style="max-width: 500px">
        <form id="reset-form" action="javascript:void(0)">
          <h1>Recuperar Contraseña</h1>

          <p
            id="instructions"
            style="
              text-align: center;
              color: var(--color-humo-gris);
              margin-bottom: 2rem;
              font-size: 0.9rem;
            "
          >
            Ingresa tu correo electrónico registrado y te enviaremos las
            instrucciones para restablecer tu contraseña.
          </p>

          <div id="reset-container">
            <div class="form-group">
              <label for="email">Correo Electrónico</label>
              <div class="input-wrapper">
                <i class="bi bi-envelope form-icon"></i>
                <input
                  type="email"
                  id="email"
                  class="form-input-neumorph with-icon"
                  placeholder="usuario@ejemplo.com"
                  required
                />
              </div>
            </div>
          </div>

          <div style="text-align: center; margin-top: 2rem">
            <input
              id="submit-btn"
              class="btn"
              type="submit"
              value="Enviar Instrucciones"
            />
          </div>

          <div style="text-align: center; margin-top: 1.5rem">
            <a
              href="login.html"
              style="color: var(--color-acento-azul); font-size: 0.9rem"
              >Volver al Inicio de Sesión</a
            >
          </div>
        </form>
      </section>
    </main>

    <jam-footer></jam-footer>

    <script src="js/components/Navbar.js"></script>
    <script src="js/components/Header.js"></script>
    <script src="js/components/Footer.js"></script>
    <script src="js/logoSound.js"></script>
    <script src="js/services/api.js"></script>
    <script src="js/reset.js"></script>
  </body>
</html>
